limit_req_zone $binary_remote_addr zone=xiaoyi_adapter:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name project.luojiatutor.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name project.luojiatutor.xyz;

    ssl_certificate /etc/nginx/certs/project.luojiatutor.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/project.luojiatutor.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ProjectMemoTLS:10m;

    client_max_body_size 1m;

    location = /health {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /xiaoyi/v1/ {
        limit_req zone=xiaoyi_adapter burst=10 nodelay;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location ^~ /api/settings {
        return 404;
    }

    location ^~ /api/ {
        allow REPLACE_WITH_YOUR_PUBLIC_IP/32;
        deny all;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
