limit_req_zone $binary_remote_addr zone=xiaoyi_adapter:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name project.luojiatutor.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name project.luojiatutor.xyz;

    ssl_certificate /etc/nginx/certs/project.luojiatutor.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/project.luojiatutor.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ProjectMemoTLS:10m;

    client_max_body_size 1m;

    # 健康检查探针：仅返回服务状态与非敏感版本指纹
    location = /health {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 小艺专属适配层：使用独立 Bearer Token，不要把小艺鉴权改成用户会话
    location ^~ /xiaoyi/v1/ {
        limit_req zone=xiaoyi_adapter burst=10 nodelay;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # 登录接口：带独立限流防爆破，允许评审端公网访问
    #
    # 这里必须「覆盖」转发头，不能用 $proxy_add_x_forwarded_for：
    # 后者会把客户端自带的 X-Forwarded-For 原样前置拼接，于是外部只要每次换一个
    # 伪造值，应用侧就按不同来源分桶，登录限流直接失效。
    # 应用侧 resolveClientIp() 也以 X-Real-IP（此处固定为 $remote_addr）为准。
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 认证状态与登出接口
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # 全局设置接口：禁止公网访问，防止外部篡改模型配置
    location ^~ /api/settings {
        return 404;
    }

    # 项目业务 API：由应用层会话 (AuthSession) 与项目归属 (ProjectMembership) 双重强制保护。
    # 未登录返回 401；跨项目越权与项目不存在统一返回 404，不暴露 projectId 是否存在。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
