<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忆程材质与动效原型</title>
<!-- 审查用独立原型：不被产品引用，不修改任何生产页面。色值取自 app/globals.css。 -->
<style>
@font-face { font-family:"PM Editorial"; src:url("../../../../public/fonts/pm-editorial-serif.ttf") format("truetype"); font-weight:500; font-display:swap; }
:root {
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#1C2E2C; --soft:#53645E; --muted:#617268; --teal:#27685D; --teal-pale:#E7F0EB;
  --amber:#8A5700; --amber-pale:#F6EEE0; --brick:#A9343C; --brick-pale:#FCEDF0; --rule:#D9E1DB; --rule-strong:#718278;
  --bar-alpha:92%;
  --dur-press:90ms; --dur-state:160ms; --dur-enter:220ms; --dur-settle:320ms; --dur-trace:640ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-standard:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"] {
  --paper:#151E1C; --card:#1D2926; --ink:#E8EEE9; --soft:#B3C4BB; --muted:#A0B3A8; --teal:#91C6B5; --teal-pale:#263F35;
  --amber:#F2C77D; --amber-pale:#332A1A; --brick:#FFB4B8; --brick-pale:#42282C; --rule:#3B4D44; --rule-strong:#859B8D; color-scheme:dark; }
* { box-sizing:border-box; margin:0; }
body { background:var(--paper); color:var(--ink); font:15px/1.7 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
main { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:40px 0 96px; display:grid; gap:72px; }
h1 { font:500 clamp(2rem,4vw,3rem)/1.25 "PM Editorial","Noto Serif SC","Songti SC",serif; letter-spacing:-.02em; }
h2 { font:500 1.5rem/1.4 "PM Editorial","Noto Serif SC","Songti SC",serif; margin-bottom:20px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible { outline:2px solid var(--teal); outline-offset:3px; border-radius:8px; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.toolbar button { min-height:44px; padding:0 14px; border:1px solid var(--rule); border-radius:10px; background:var(--card); }
.toolbar button[aria-pressed="true"] { background:var(--teal-pale); border-color:var(--teal); }
.tiers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.tier { position:relative; height:280px; overflow:hidden; border:1px solid var(--rule); border-radius:14px; background:var(--card); }
.tier .scroller { position:absolute; inset:0; overflow:auto; padding:68px 16px 16px; display:grid; gap:10px; align-content:start; }
.tier .row { padding:12px; border:1px solid var(--rule); border-radius:10px; background:var(--card); }
.tier .row strong { display:block; font-weight:600; font-size:14px; }
.tier .row span { color:var(--soft); font-size:13px; }
.tier .row.dark { background:var(--ink); color:var(--paper); border-color:transparent; }
.tier .row.dark span { color:inherit; opacity:.8; }
.bar { z-index:2; position:absolute; inset:0 0 auto; height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-weight:600; font-size:14px; border-bottom:1px solid transparent; }
.bar small { font-weight:400; color:var(--soft); font-size:13px; }
.t-solid .bar { background:var(--paper); border-color:var(--rule); }
.t-frost .bar { background:color-mix(in srgb,var(--paper) var(--bar-alpha),transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-color:var(--rule); }
.t-frost[data-at-top="true"] .bar { background:var(--paper); -webkit-backdrop-filter:none; backdrop-filter:none; border-color:transparent; }
.t-liquid .bar { inset:8px 8px auto; height:48px; border-radius:16px; background:color-mix(in srgb,var(--paper) 50%,transparent); -webkit-backdrop-filter:blur(8px) saturate(1.5); backdrop-filter:blur(8px) saturate(1.5); box-shadow:inset 0 1px 0 #ffffffb0,0 8px 24px -14px #0006; }
figcaption { margin-top:8px; font-size:13px; color:var(--soft); }
.agent { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; }
.stage { padding:20px; border:1px solid var(--rule); border-radius:14px; background:var(--card); min-height:360px; }
.thread { list-style:none; padding:0; display:grid; position:relative; }
.thread li { position:relative; padding:0 0 18px 26px; }
.thread li:last-child { padding-bottom:0; }
.thread li::before { content:""; position:absolute; left:6px; top:13px; bottom:-7px; width:1.5px; background:var(--rule); transform-origin:top; }
.thread li:last-child::before { display:none; }
.thread li[data-done]::before { background:var(--teal); animation:draw var(--dur-trace) var(--ease-standard) both; }
.dot { position:absolute; left:0; top:6px; width:13px; height:13px; border-radius:50%; background:var(--card); border:1.5px solid var(--rule-strong); display:grid; place-items:center; transition:background-color var(--dur-state),border-color var(--dur-state),transform var(--dur-settle) var(--ease-out); }
li[data-state="done"] .dot { background:var(--teal); border-color:var(--teal); }
li[data-state="read"] .dot { border-color:var(--teal); }
li[data-state="read"] .dot::after { content:""; width:5px; height:5px; border-radius:50%; background:var(--teal); animation:scan 1.1s var(--ease-standard) infinite alternate; }
li[data-state="tool"] .dot { border-color:var(--teal); border-radius:4px; }
li[data-state="wait"] .dot { border-color:var(--amber); background:var(--amber); transform:scale(1.15); }
li[data-state="fail"] .dot { border-color:var(--brick); background:var(--brick-pale); }
li[data-state="fail"] .dot::after { content:""; width:7px; height:1.5px; background:var(--brick); }
.line-title { font-size:14px; font-weight:600; }
.line-note { font-size:13px; color:var(--soft); }
.read-text { background:linear-gradient(90deg,var(--ink) 0 40%,var(--muted) 50%,var(--ink) 60% 100%) 0 0/250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sweep 1.8s linear infinite; }
.source-chip { display:inline-block; margin-top:4px; padding:0 8px; border:1px solid var(--rule); border-radius:6px; font-size:12px; color:var(--soft); animation:rise var(--dur-enter) var(--ease-out) both; }
.approval { margin-top:4px; padding:12px; border:1px solid var(--amber); border-radius:12px; background:var(--amber-pale); animation:rise var(--dur-settle) var(--ease-out) both; }
.approval strong { display:block; font-size:14px; }
.approval button { margin-top:8px; min-height:44px; padding:0 14px; border-radius:10px; background:var(--teal); color:var(--card); font-weight:600; }
.receipt { margin-top:4px; padding:8px 12px; border-left:2px solid var(--teal); background:var(--teal-pale); border-radius:0 8px 8px 0; font-size:13px; animation:settle var(--dur-settle) var(--ease-out) both; }
.retry { display:inline-flex; align-items:center; min-height:44px; color:var(--teal); font-size:13px; font-weight:600; }
@keyframes draw { from { transform:scaleY(0); } to { transform:scaleY(1); } }
@keyframes scan { from { transform:translateX(-2px); } to { transform:translateX(2px); } }
@keyframes sweep { from { background-position:100% 0; } to { background-position:-50% 0; } }
@keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@keyframes settle { from { background-color:transparent; } to { background-color:var(--teal-pale); } }
.steps { display:grid; gap:6px; }
.steps button { display:flex; justify-content:space-between; gap:12px; width:100%; min-height:44px; padding:0 12px; border:1px solid var(--rule); border-radius:10px; background:var(--card); text-align:left; align-items:center; }
.steps button[aria-pressed="true"] { border-color:var(--teal); background:var(--teal-pale); }
.steps small { color:var(--muted); font-variant-numeric:tabular-nums; }
.evidence { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; position:relative; padding:20px; border:1px solid var(--rule); border-radius:14px; background:var(--card); }
.claim { font-size:17px; line-height:1.9; }
.claim mark { background:none; color:inherit; border-bottom:1.5px solid var(--rule-strong); cursor:pointer; transition:border-color var(--dur-state),background-color var(--dur-state); }
.claim mark[data-on="true"] { border-color:var(--teal); background:var(--teal-pale); }
.sources { display:grid; gap:10px; }
.src { padding:10px 12px; border:1px solid var(--rule); border-radius:10px; font-size:13px; color:var(--soft); transition:border-color var(--dur-state),color var(--dur-state); }
.src strong { display:block; color:var(--ink); font-size:14px; }
.src[data-on="true"] { border-color:var(--teal); color:var(--ink); }
.link-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.link-layer path { fill:none; stroke:var(--teal); stroke-width:1.5; stroke-dasharray:1; stroke-dashoffset:1; }
.link-layer path[data-on="true"] { stroke-dashoffset:0; transition:stroke-dashoffset var(--dur-trace) var(--ease-standard); }
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
  .read-text { background:none; color:var(--ink); }
}
:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before,:root[data-motion="reduced"] *::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
:root[data-motion="reduced"] .read-text { background:none; color:var(--ink); }
@media (prefers-reduced-transparency:reduce) { .t-frost .bar,.t-liquid .bar { background:var(--paper); -webkit-backdrop-filter:none; backdrop-filter:none; } }
@media (max-width:820px) { .tiers,.agent,.evidence { grid-template-columns:minmax(0,1fr); } .evidence { gap:16px; } .link-layer { display:none; } }
</style>
</head>
<body>
<main>
<header>
  <h1>材质与动效原型</h1>
  <div class="toolbar">
    <button type="button" id="theme" aria-pressed="false">深色</button>
    <button type="button" id="motion" aria-pressed="false">减少动效</button>
  </div>
</header>
<section aria-labelledby="a">
  <h2 id="a">材质阶梯</h2>
  <div class="tiers">
    <figure><div class="tier t-solid"><div class="bar">项目<small>实体</small></div><div class="scroller" data-rows></div></div><figcaption>当前工作台顶栏</figcaption></figure>
    <figure><div class="tier t-frost" data-at-top="true"><div class="bar">项目<small>滚动后才透</small></div><div class="scroller" data-rows data-watch></div></div><figcaption>推荐：不透明度 92%，静止时实体</figcaption></figure>
    <figure><div class="tier t-liquid"><div class="bar">项目<small>不推荐</small></div><div class="scroller" data-rows></div></div><figcaption>50% 透明：滚过深色内容时对比度跌破 AA</figcaption></figure>
  </div>
</section>
<section aria-labelledby="b">
  <h2 id="b">Agent 状态语言</h2>
  <div class="agent">
    <div class="stage" aria-live="polite"><ol class="thread" id="thread"></ol></div>
    <div class="steps" id="steps"></div>
  </div>
</section>
<section aria-labelledby="c">
  <h2 id="c">证据牵引线</h2>
  <div class="evidence" id="evidence">
    <svg class="link-layer" id="links" aria-hidden="true"></svg>
    <p class="claim">先补<mark tabindex="0" data-src="s1">演示结果</mark>，再写汇报；<mark tabindex="0" data-src="s2">比赛要求</mark>已对应到来源。</p>
    <div class="sources">
      <div class="src" id="s1"><strong>任务安排 · 10/18</strong>目前还没有完整 Demo，需要先完成项目创建、碎片捕获和成果生成闭环。</div>
      <div class="src" id="s2"><strong>比赛材料 · 10/20</strong>初赛需要准备创意描述、设计稿、作品介绍文档和演示材料。</div>
    </div>
  </div>
</section>
</main>
<script>
const root = document.documentElement;
function toggle(id, on, off) {
  const b = document.getElementById(id);
  b.addEventListener("click", () => { const v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(v)); v ? on() : off(); });
}
toggle("theme", () => root.dataset.theme = "dark", () => root.dataset.theme = "light");
toggle("motion", () => root.dataset.motion = "reduced", () => delete root.dataset.motion);
const rows = [["需要回应", "演示流程的实际结果"], ["接下来要做", "补充运行截图"], ["委托", "整理阶段汇报"], ["收尾", "结果写回原委托", true], ["记录", "老师建议 10/23"], ["记录", "比赛材料 10/20"], ["记录", "任务安排 10/18"]];
document.querySelectorAll("[data-rows]").forEach(el => {
  el.innerHTML = rows.map(([a, b, dark]) => `<div class="row${dark ? " dark" : ""}"><strong>${a}</strong><span>${b}</span></div>`).join("");
});
document.querySelectorAll("[data-watch]").forEach(el => {
  const tier = el.closest(".tier");
  el.addEventListener("scroll", () => { tier.dataset.atTop = String(el.scrollTop < 4); }, { passive: true });
});
const phases = [
  { key: "检索", code: "ROUTING", items: [["read", "定位相关项目"]] },
  { key: "读原文", code: "READING_SOURCE", items: [["done", "定位相关项目"], ["read", "读取任务安排", "", "任务安排 10/18"]] },
  { key: "判断", code: "EVALUATING", items: [["done", "定位相关项目"], ["done", "读取任务安排", "", "任务安排 10/18"], ["read", "比较目标与现状"]] },
  { key: "调工具", code: "tool", items: [["done", "读取任务安排"], ["done", "比较目标与现状"], ["tool", "核对部署记录", "只读 · 单次"]] },
  { key: "等确认", code: "WAITING_USER", items: [["done", "读取任务安排"], ["done", "比较目标与现状"], ["wait", "等你确认", "", "", "approval"]] },
  { key: "完成", code: "SUCCEEDED", items: [["done", "读取任务安排"], ["done", "比较目标与现状"], ["done", "已创建行动", "", "", "receipt"]] },
  { key: "失败", code: "FAILED", items: [["done", "读取任务安排"], ["fail", "老师反馈附件未读到", "其余结论不受影响", "", "retry"]] },
  { key: "恢复", code: "RECOORDINATING", items: [["done", "读取任务安排"], ["done", "老师反馈附件已读到"], ["read", "按新材料重新判断"]] },
];
const thread = document.getElementById("thread"), steps = document.getElementById("steps");
function render(i) {
  const p = phases[i];
  thread.innerHTML = p.items.map(([state, title, note, chip, extra], n) => `<li data-state="${state}" ${state === "done" && n < p.items.length - 1 ? "data-done" : ""}><span class="dot"></span>
    <div class="line-title${state === "read" ? " read-text" : ""}">${title}</div>${note ? `<div class="line-note">${note}</div>` : ""}${chip ? `<span class="source-chip">${chip}</span>` : ""}
    ${extra === "approval" ? `<div class="approval"><strong>创建行动：补充演示运行结果</strong><button type="button">确认创建</button></div>` : ""}
    ${extra === "receipt" ? `<div class="receipt">结果已写回原委托</div>` : ""}${extra === "retry" ? `<button type="button" class="retry">重新读取</button>` : ""}</li>`).join("");
  [...steps.children].forEach((b, n) => b.setAttribute("aria-pressed", String(n === i)));
}
steps.innerHTML = phases.map((p, i) => `<button type="button" data-i="${i}"><span>${p.key}</span><small>${p.code}</small></button>`).join("");
steps.addEventListener("click", e => { const b = e.target.closest("button"); if (b) render(Number(b.dataset.i)); });
render(1);
const ev = document.getElementById("evidence"), svg = document.getElementById("links");
function link(mark, on) {
  const src = document.getElementById(mark.dataset.src);
  mark.dataset.on = on; src.dataset.on = on;
  svg.innerHTML = "";
  if (!on) return;
  const R = ev.getBoundingClientRect(), a = mark.getBoundingClientRect(), b = src.getBoundingClientRect();
  const x1 = a.right - R.left, y1 = a.bottom - R.top, x2 = b.left - R.left, y2 = b.top + b.height / 2 - R.top;
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x1} ${y1} C${x1 + 40} ${y1},${x2 - 40} ${y2},${x2} ${y2}`);
  p.setAttribute("pathLength", "1"); svg.append(p);
  requestAnimationFrame(() => requestAnimationFrame(() => p.dataset.on = "true"));
}
document.querySelectorAll(".claim mark").forEach(m => {
  ["mouseenter", "focus"].forEach(t => m.addEventListener(t, () => link(m, true)));
  ["mouseleave", "blur"].forEach(t => m.addEventListener(t, () => link(m, false)));
});
</script>
</body>
</html>
